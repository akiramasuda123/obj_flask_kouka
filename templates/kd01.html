{% extends 'base.html' %}
{% block content %}
<div class="card-custom">
    <h3 class="text-center mb-4">貸出</h3>
    <form action="{{ url_for('loan.kd01') }}" method="POST">
        <div class="mb-3">
            <label class="form-label">会員番号</label>
            <input type="text" name="member_number" class="form-control" placeholder="0000000" required>
        </div>

        <p class="text-muted small mb-2">貸し出す図書の管理番号を入力してください</p>
        <div class="row g-2 mb-3">
            {% for i in range(1, 13) %}
            <div class="col-6">
                <input type="text" name="management_number_{{ i }}" class="form-control form-control-sm" placeholder="管理番号 {{ i }}">
            </div>
            {% endfor %}
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-secondary">次へ ⇒ KD02</button>
        </div>
    </form>
</div>
{% endblock %}
