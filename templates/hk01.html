{% extends 'base.html' %}
{% block content %}
<div class="card-custom">
    <h3 class="text-center mb-4">返却</h3>
    <form action="{{ url_for('return_book.hk01') }}" method="POST">
        <p class="text-muted small mb-2">返却する図書の管理番号を入力してください</p>
        <div class="row g-2 mb-4">
            {% for i in range(1, 13) %}
            <div class="col-6">
                <input type="text" name="management_number_{{ i }}" class="form-control form-control-sm" placeholder="管理番号 {{ i }}">
            </div>
            {% endfor %}
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-secondary">次へ ⇒ HK02</button>
        </div>
    </form>
</div>
{% endblock %}
